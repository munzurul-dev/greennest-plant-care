<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/leaf.svg"
    />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>GreenNest | Grow Your Green World</title>
    <meta
      name="description"
      content="Discover GreenNest, your destination for plants, gardening tips, and expert guidance. Explore a greener lifestyle and grow your own green world."
    />
    <meta
      name="keywords"
      content="GreenNest, plants, indoor plants, gardening, plant care, gardening tips, plant experts"
    />
    <meta name="author" content="GreenNest" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#176b45" />

    <!-- Canonical URL: Replace with your actual domain -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GreenNest | Grow Your Green World" />
    <meta
      property="og:description"
      content="Explore plants, gardening tips, and expert guidance with GreenNest. Start your green journey today."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta property="og:site_name" content="GreenNest" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GreenNest | Grow Your Green World" />
    <meta
      name="twitter:description"
      content="Discover plants, gardening tips, and expert guidance with GreenNest."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />

    <title>GreenNest | Grow Your Green World</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
